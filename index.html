<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0a24">
<title>Sagix</title>

<style>
:root{
  --bg:#0c0a24;
  --panel:#17133b;
  --accent:#8fd3ff;
  --pink:#ffb3d1;
  --text:#f7f4ff;
  --muted:#b9b4d6;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(
      circle at 50% 18%,
      #292263 0,
      #0c0a24 48%,
      #070617 100%
    );
  color:var(--text);
}

button,input{
  font:inherit;
}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
}

header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #ffffff12;
  background:#0c0a24cc;
  backdrop-filter:blur(10px);
}

.brand{
  font-weight:800;
  letter-spacing:.5px;
  font-size:21px;
}

.icon{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#ffffff10;
  color:var(--text);
  font-size:19px;
}

main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.avatar-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  min-height:250px;
}

.avatar{
  width:150px;
  height:150px;
  border-radius:50%;
  position:relative;

  background:
    radial-gradient(
      circle at 32% 22%,
      #ffffff 0 7%,
      #fffbd1 15%,
      #ffe94f 34%,
      #ffd21c 58%,
      #f5b800 82%,
      #d99400 100%
    );

  box-shadow:
    inset -12px -15px 22px rgba(180,120,0,.28),
    inset 10px 8px 18px rgba(255,255,255,.75),
    0 0 20px rgba(255,220,50,.75),
    0 0 50px rgba(255,200,20,.45),
    0 0 90px rgba(255,180,0,.25);

  animation:float 4.5s ease-in-out infinite;
  transition:transform .18s ease;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;

  overflow:hidden;
}

/* Reflejo de cristal */
.avatar::before{
  content:"";
  position:absolute;
  width:65px;
  height:35px;
  top:18px;
  left:25px;
  border-radius:50%;
  background:rgba(255,255,255,.42);
  filter:blur(5px);
  transform:rotate(-18deg);
  pointer-events:none;
}

/* Brillo suave inferior */
.avatar::after{
  content:"";
  position:absolute;
  width:90px;
  height:45px;
  bottom:8px;
  left:30px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  filter:blur(10px);
  pointer-events:none;
}
.avatar.pulse{
  animation:none;
  transform:scale(1.08) !important;
}
  .avatar.chat-avatar{
  width:44px;
  height:44px;
  }
  .avatar-area.chat-mode{
  align-items:flex-start;
  justify-content:flex-start;
  padding:12px 14px;
  }
  .avatar.chat-avatar .eye{
  width:8px;
  height:14px;
  top:15px;
  }
  .avatar.chat-avatar .eye.left{
  left:11px;
}

.avatar.chat-avatar .eye.right{
  right:11px;
}
.eye{
  position:absolute;
  top:48px;
  width:25px;
  height:38px;
  border-radius:50%;

  background:#080808;

  box-shadow:
    0 2px 4px rgba(0,0,0,.25);

  transition:
    transform .08s ease,
    height .12s ease;
}



.eye.left{
  left:40px;
}

.eye.right{
  right:40px;
}


.eye.blink{
  transform:scaleY(0.08);
}


.mouth{
  position:absolute;
  left:50%;
  top:101px;
  width:25px;
  height:12px;
  border-bottom:4px solid #292044;
  border-radius:0 0 20px 20px;
  transform:translateX(-50%);
}

@keyframes float{
  0%,100%{
    transform:translateY(0) scale(1);
  }

  50%{
    transform:translateY(-10px) scale(1);
  }
}
@keyframes pulse{
  50%{
    transform:scale(1.08);
  }
}
.welcome{
  text-align:center;
  padding:0 24px 18px;
}

.welcome h1{
  font-size:25px;
  margin:0 0 7px;
}

.welcome p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

.chat{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:10px 14px;
  max-height:35%;
  overflow:auto;
}

.msg{
  max-width:82%;
  padding:10px 13px;
  border-radius:16px;
  line-height:1.35;
  font-size:14px;
}

.sagix{
  align-self:flex-start;
  background:#ffffff12;
}

.user{
  align-self:flex-end;
  background:#5b4ccf;
}
  .sagix-row{
  display:flex;
  align-items:flex-start;
  gap:8px;
  align-self:flex-start;
  max-width:90%;
}

.sagix-row .sagix{
  align-self:auto;
}

.composer{
  padding:
    10px
    12px
    calc(10px + env(safe-area-inset-bottom));

  display:flex;
  gap:8px;

  background:#0c0a24ee;
  border-top:1px solid #ffffff12;
}

.composer input{
  flex:1;
  min-width:0;

  border:1px solid #ffffff18;
  border-radius:22px;

  padding:12px 15px;

  background:#ffffff0d;
  color:var(--text);

  outline:none;
}

.composer input:focus{
  border-color:#8fd3ff66;
}

.send{
  border:0;
  border-radius:22px;
  padding:0 18px;

  background:var(--pink);
  color:#24162a;

  font-weight:800;
}
</style>
</head>

<body>

<div class="app">

  <header>
    <button class="icon" aria-label="Menú">☰</button>

    <div class="brand">
      Sagix
    </div>

    <button class="icon" aria-label="Voz">🔊</button>
  </header>


  <main>

    <section class="avatar-area">

      <div
        class="avatar"
        aria-label="Avatar de Sagix"
      >

        <div class="eye left"></div>
        <div class="eye right"></div>

        

        

      </div>

    </section>


    <section class="welcome" aria-hidden="true">
    </section>


    <section
      class="chat"
      aria-live="polite"
    >

      
      </section>

    


    <form
      class="composer"
      id="composer"
    >

      <input
        id="input"
        autocomplete="off"
        placeholder="Escribe un mensaje"
        aria-label="Mensaje"
      >

      <button
        class="send"
        type="submit"
      >
        Enviar
      </button>

    </form>

  </main>

</div>


<script>

const composer =
  document.getElementById('composer');

const input =
  document.getElementById('input');

const chat =
  document.querySelector('.chat');


composer.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const value =
      input.value.trim();

    if(!value) return;


    const msg =
      document.createElement('div');

    msg.className =
      'msg user';

    msg.textContent =
      value;


    chat.appendChild(msg);

    input.value = '';
    input.focus();

    chat.scrollTop =
      chat.scrollHeight;

  }
);
const avatar = document.querySelector('.avatar');
  

avatar.addEventListener('click', () => {
  avatar.classList.add('pulse');

setTimeout(() => {
  avatar.classList.remove('pulse');
}, 500);

  
});
  const eyes = document.querySelectorAll('.eye');

function blink(){
  eyes.forEach(eye => {
    eye.classList.add('blink');
  });

  setTimeout(() => {
    eyes.forEach(eye => {
      eye.classList.remove('blink');
    });
  }, 100);
}
  function scheduleBlink(){
  const nextBlink = 5000 + Math.random() * 6000;

  setTimeout(() => {
    blink();

    if(Math.random() < 0.18){
      setTimeout(blink, 180);
    }

    scheduleBlink();
  }, nextBlink);
}

scheduleBlink();
</script>

</body>
</html>
